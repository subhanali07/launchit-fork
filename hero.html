<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <!-- Attempt to load JA Jayagri Sans from Google Fonts (if available) else fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Jayagri+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lime: #CFFF04;
            --dark-bg: #0a0a0a;
            --dark-text: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        body {
            margin: 0;
            font-family: 'Jayagri Sans', sans-serif;
            background-color: var(--dark-bg);
            color: var(--dark-text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .hero {
            max-width: 800px;
            padding: 2rem;
            background: rgba(0,0,0,0.6);
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin: 0 0 1rem;
            background: linear-gradient(to right, var(--lime), #a8d900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.5;
        }
        .hero .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark-bg);
            background-color: var(--lime);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(207,255,4,0.4);
        }
        .hero .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(207,255,4,0.6);
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }
            .hero p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Creative Studio</h1>
        <p>Bringing ideas to life with bold designs and innovative solutions.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
</body>
</html>
